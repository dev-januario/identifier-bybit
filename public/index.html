        function playAlert(isLong) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

        // ── Indicadores ──────────────────────────────────────────────────────────
        function ema(closes, period) {
            if (closes.length < period) return [];
            const k = 2 / (period + 1);
            let val = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
            const out = [val];
            for (let i = period; i < closes.length; i++) {
                val = closes[i] * k + val * (1 - k);
                out.push(val);
            }
            return out;
        }

        function bollingerBands(closes, period, stdMultiplier) {
            const upper = [], middle = [], lower = [];
            for (let i = period - 1; i < closes.length; i++) {
                const slice = closes.slice(i - period + 1, i + 1);
                const mean = slice.reduce((a, b) => a + b, 0) / period;
                const vari = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
                const sd = Math.sqrt(vari);
                upper.push(mean + stdMultiplier * sd);
                middle.push(mean);
                lower.push(mean - stdMultiplier * sd);
            }
            return { upper, middle, lower };
        }



        function candlePattern(candles) {
            const c = candles[candles.length - 1];
            const p = candles[candles.length - 2];
            const cBody = Math.abs(c.close - c.open);
            const pBody = Math.abs(p.close - p.open);

            if (c.close > c.open && p.close < p.open &&
                c.close > p.open && c.open < p.close && cBody > pBody)
                return 'Engolfo Alta';
            if (c.close < c.open && p.close > p.open &&
                c.close < p.open && c.open > p.close && cBody > pBody)
                return 'Engolfo Baixa';
            if (c.close > c.open &&
                (c.open - c.low) > 2 * cBody &&
                (c.high - c.close) < cBody)
                return 'Martelo';
            if (c.close < c.open &&
                (c.high - c.open) > 2 * cBody &&
                (c.close - c.low) < cBody)
                return 'Estrela Cadente';
            return null;
        }

        // ── SMC Helpers — Pine Script Híbrido ──────────────────────────────────
        // ATR médio dos últimos 'period' candles
        function calcATR(candles, period) {
            const p = Math.min(period, candles.length - 1);
            let sum = 0;
            for (let i = candles.length - p; i < candles.length; i++) {
                sum += Math.max(
                    candles[i].high - candles[i].low,
                    Math.abs(candles[i].high - candles[i - 1].close),
                    Math.abs(candles[i].low - candles[i - 1].close)
                );
            }
            return sum / p;
        }

        // Extremos ajustados: candles de alta volatilidade (>= 2×ATR) têm high/low invertidos
        // Evita que spikes manipulatórios distorçam o Order Block — lógica parsedHighs/parsedLows do Pine
        function getParsedExtremes(candles, atr) {
            return candles.map(c => {
                const highVol = (c.high - c.low) >= 2 * atr;
                return { parsedHigh: highVol ? c.low : c.high, parsedLow: highVol ? c.high : c.low };
            });
        }

        // Detecta pivôs com 'size' candles de confirmação em cada lado
        // Equivalente direto ao leg(size) do Pine Script
        function detectPivots(candles, size) {
            const swingHighs = [], swingLows = [];
            const limit = candles.length - size;
            for (let i = size; i < limit; i++) {
                let isHigh = true, isLow = true;
                for (let j = i - size; j <= i + size; j++) {
                    if (j === i) continue;
                    if (candles[j].high >= candles[i].high) isHigh = false;
                    if (candles[j].low <= candles[i].low) isLow = false;
                }
                if (isHigh) swingHighs.push({ index: i, price: candles[i].high });
                if (isLow) swingLows.push({ index: i, price: candles[i].low });
            }
            return { swingHighs, swingLows };
        }

        // OB Bullish: candle com menor parsedLow na faixa — lógica storeOrderBlock(BULLISH) do Pine
        function findBullishOBParsed(candles, parsed, fromIdx, toIdx) {
            let minPL = Infinity, obIdx = fromIdx;
            for (let i = fromIdx; i <= toIdx; i++) {
                if (parsed[i].parsedLow < minPL) { minPL = parsed[i].parsedLow; obIdx = i; }
            }
            return { high: candles[obIdx].high, low: candles[obIdx].low };
        }

        // OB Bearish: candle com maior parsedHigh na faixa — lógica storeOrderBlock(BEARISH) do Pine
        function findBearishOBParsed(candles, parsed, fromIdx, toIdx) {
            let maxPH = -Infinity, obIdx = fromIdx;
            for (let i = fromIdx; i <= toIdx; i++) {
                if (parsed[i].parsedHigh > maxPH) { maxPH = parsed[i].parsedHigh; obIdx = i; }
            }
            return { high: candles[obIdx].high, low: candles[obIdx].low };
        }

        // ── Swing Order Blocks ativos (Supply/Demand) — Pine Script storeOrdeBlock() ────────────
        // OB Bullish (demand/azul) : formado quando close rompe acima do swingHigh → candle de menor
        //   parsedLow na perna (zona onde compradores institucionais absorveram a oferta)
        // OB Bearish (supply/vermelho): formado quando close rompe abaixo do swingLow → candle de maior
        //   parsedHigh na perna (zona onde vendedores institucionais absorveram a demanda)
        // Mitigação: OB bullish inválido se close < ob.low | OB bearish inválido se close > ob.high
        function buildActiveOrderBlocks(wCandles, parsed, size) {
            const n = wCandles.length;
            const bullishOBs = [];
            const bearishOBs = [];

            const { swingHighs, swingLows } = detectPivots(wCandles, size);

            // Cada pivô só é "conhecido" após 'size' barras de confirmação (replica o delay do Pine Script)
            const events = [];
            for (const sh of swingHighs) events.push({ type: 'SH', idx: sh.index, level: sh.price, confirmedAt: sh.index + size });
            for (const sl of swingLows) events.push({ type: 'SL', idx: sl.index, level: sl.price, confirmedAt: sl.index + size });
            events.sort((a, b) => a.confirmedAt - b.confirmedAt);

            let trackSH = null;
            let trackSL = null;
            let evPtr = 0;

            for (let b = 0; b < n; b++) {
                // Atualiza o pivô ativo à medida que os candles são confirmados
                while (evPtr < events.length && events[evPtr].confirmedAt <= b) {
                    const ev = events[evPtr++];
                    if (ev.type === 'SH') {
                        trackSH = { level: ev.level, idx: ev.idx, crossed: false };
                    } else {
                        trackSL = { level: ev.level, idx: ev.idx, crossed: false };
                    }
                }
                const c = wCandles[b];

                // Rompimento bullish: close acima do swingHigh → cria OB de demanda (azul)
                if (trackSH && !trackSH.crossed && c.close > trackSH.level) {
                    trackSH.crossed = true;
                    let minPL = Infinity, obIdx = trackSH.idx;
                    for (let k = trackSH.idx; k <= b; k++) {
                        if (parsed[k] && parsed[k].parsedLow < minPL) { minPL = parsed[k].parsedLow; obIdx = k; }
                    }
                    bullishOBs.push({ high: wCandles[obIdx].high, low: wCandles[obIdx].low, mitigated: false });
                }

                // Rompimento bearish: close abaixo do swingLow → cria OB de oferta (vermelho)
                if (trackSL && !trackSL.crossed && c.close < trackSL.level) {
                    trackSL.crossed = true;
                    let maxPH = -Infinity, obIdx = trackSL.idx;
                    for (let k = trackSL.idx; k <= b; k++) {
                        if (parsed[k] && parsed[k].parsedHigh > maxPH) { maxPH = parsed[k].parsedHigh; obIdx = k; }
                    }
                    bearishOBs.push({ high: wCandles[obIdx].high, low: wCandles[obIdx].low, mitigated: false });
                }

                // Mitigação de OBs: remove zona quando o preço fecha através dela
                for (const ob of bullishOBs) {
                    if (!ob.mitigated && c.close < ob.low) ob.mitigated = true;
                }
                for (const ob of bearishOBs) {
                    if (!ob.mitigated && c.close > ob.high) ob.mitigated = true;
                }
            }

            return {
                bullishOBs: bullishOBs.filter(ob => !ob.mitigated),
                bearishOBs: bearishOBs.filter(ob => !ob.mitigated)
            };
        }

        // Retorna o OB tocado pelo candle atual (margem de 0,2%) ou null se nenhum for tocado
        // Bullish OB: wick desce até o OB e fechamento não rompe abaixo do fundo
        // Bearish OB: wick sobe até o OB e fechamento não rompe acima do topo
        function priceInOB(candle, obs, isBullish) {
            const margin = candle.close * 0.002;
            for (const ob of obs) {
                if (isBullish) {
                    // Wick entra na zona (low ≤ topo do OB) E fechamento está DENTRO ou muito próximo do OB
                    // Rejeita candles que já subiram muito acima do OB (close > ob.high * 1.015)
                    if (candle.low <= ob.high + margin && candle.close >= ob.low && candle.close <= ob.high * 1.015) return ob;
                } else {
                    // Wick entra na zona (high ≥ fundo do OB) E fechamento está DENTRO ou muito próximo do OB
                    // Rejeita candles que já caíram muito abaixo do OB (close < ob.low * 0.985)
                    if (candle.high >= ob.low - margin && candle.close <= ob.high && candle.close >= ob.low * 0.985) return ob;
                }
            }
            return null;
        }

        function analyzeSignal(candles) {
            const minLen = 80;
            if (candles.length < minLen) return null;

            // Exclui o candle live (último) — trabalha apenas com candles fechados
            const closed = candles.slice(0, -1);
            const wCandles = closed.slice(-150);
            const n = wCandles.length;
            if (n < 70) return null;

            // ATR e extremos ajustados por volatilidade
            const atr = calcATR(wCandles, Math.min(50, n - 1));
            const parsed = getParsedExtremes(wCandles, atr);

            // Order Blocks ativos (swing com 10 candles de confirmação cada lado)
            const { bullishOBs, bearishOBs } = buildActiveOrderBlocks(wCandles, parsed, 10);

            const closes = closed.map(c => c.close);
            const cur = wCandles[n - 1]; // último candle fechado
            const prev = wCandles[n - 2];
            const prev2 = wCandles[n - 3];

            // ── BB %B ────────────────────────────────────────────────────────────
            const bb = bollingerBands(closes, BB_PERIOD, BB_STD);
            const bbUpper = bb.upper[bb.upper.length - 1];
            const bbLower = bb.lower[bb.lower.length - 1];
            const bbpArr = bb.upper.map((u, i) => {
                const range = u - bb.lower[i];
                return range === 0 ? 0.5 : (closes[i + BB_PERIOD - 1] - bb.lower[i]) / range;
            });
            const lastBBP = bbpArr[bbpArr.length - 1];
            const prevBBP = bbpArr[bbpArr.length - 2] ?? lastBBP;
            const prev2BBP = bbpArr[bbpArr.length - 3] ?? prevBBP;

            // ── Estrutura de mercado (swing com 10 candles) ──────────────────────
            const { swingHighs, swingLows } = detectPivots(wCandles, 10);
            const isHHHL = swingHighs.length >= 2 && swingLows.length >= 2 &&
                swingHighs[swingHighs.length - 1].price > swingHighs[swingHighs.length - 2].price &&
                swingLows[swingLows.length - 1].price > swingLows[swingLows.length - 2].price;
            const isLHLL = swingHighs.length >= 2 && swingLows.length >= 2 &&
                swingHighs[swingHighs.length - 1].price < swingHighs[swingHighs.length - 2].price &&
                swingLows[swingLows.length - 1].price < swingLows[swingLows.length - 2].price;

            const lastSH = swingHighs.length >= 1 ? swingHighs[swingHighs.length - 1] : null;
            const lastSL = swingLows.length >= 1 ? swingLows[swingLows.length - 1] : null;

            // ── Vela de OURO: range atual > range anterior ───────────────────────
            const curRange = cur.high - cur.low;
            const prevRange = prev.high - prev.low;
            const avg3Range = (curRange + prevRange + (prev2.high - prev2.low)) / 3;
            const bullishGold = cur.close > cur.open && prev.close < prev.open && curRange > prevRange;
            const bearishGold = cur.close < cur.open && prev.close > prev.open && curRange > prevRange;
            // ── Vela de PRATA: range atual > média dos 3 últimos candles ─────────
            const bullishSilver = cur.close > cur.open && prev.close < prev.open && curRange > avg3Range;
            const bearishSilver = cur.close < cur.open && prev.close > prev.open && curRange > avg3Range;
            const hasReversalCandle = (isLong) => isLong
                ? (bullishGold || bullishSilver)
                : (bearishGold || bearishSilver);
            const candleLabel = (isLong) => {
                if (isLong) return bullishGold ? '🥇 Vela de OURO Bullish' : '🥈 Vela de PRATA Bullish';
                return bearishGold ? '🥇 Vela de OURO Bearish' : '🥈 Vela de PRATA Bearish';
            };

            // ── Golden Pocket 0.705–0.786 ────────────────────────────────────────
            const fiboHigh = Math.max(...wCandles.slice(-50).map(c => c.high));
            const fiboLow = Math.min(...wCandles.slice(-50).map(c => c.low));
            const fiboRange = fiboHigh - fiboLow;
            const gpTopLong = fiboHigh - fiboRange * 0.705;
            const gpBottomLong = fiboHigh - fiboRange * 0.786;
            const gpTopShort = fiboLow + fiboRange * 0.786;
            const gpBottomShort = fiboLow + fiboRange * 0.705;
            const inGPLong = cur.low <= gpTopLong && cur.close >= gpBottomLong;
            const inGPShort = cur.high >= gpBottomShort && cur.close <= gpTopShort;

            // ── ALERTA FORTE ─────────────────────────────────────────────────────
            // Todos os 5 confirmam: OB (candle atual) + BB %B extremo revertendo
            //   + Vela Ouro/Prata + Swing HH/HL ou LH/LL + Golden Pocket
            const curInLongOB = priceInOB(cur, bullishOBs, true);
            const curInShortOB = priceInOB(cur, bearishOBs, false);

            // LONG
            if (curInLongOB && prevBBP <= BBP_OVERSOLD && lastBBP > prevBBP &&
                hasReversalCandle(true) && isHHHL && inGPLong) {
                const slPrice = cur.low;
                const risk = cur.close - slPrice;
                if (risk > 0) {
                    const rrTP = cur.close + 2 * risk;
                    const tpPrice = bbUpper > cur.close ? Math.max(bbUpper, rrTP) : rrTP;
                    const gpTag = ' 🎯GP';
                    const retracePct = lastSH && lastSL
                        ? Math.round(((lastSH.price - cur.close) / Math.max(lastSH.price - lastSL.price, 0.0001)) * 100)
                        : 0;
                    return {
                        isLong: true, price: cur.close, rsi: lastBBP, tpPrice, slPrice,
                        candle: candleLabel(true) + gpTag + ' 🟦OB',
                        rsiBonus: true, retracePct
                    };
                }
            }

            // SHORT
            if (curInShortOB && prevBBP >= BBP_OVERBOUGHT && lastBBP < prevBBP &&
                hasReversalCandle(false) && isLHLL && inGPShort) {
                const slPrice = cur.high;
                const risk = slPrice - cur.close;
                if (risk > 0) {
                    const rrTP = cur.close - 2 * risk;
                    const tpPrice = bbLower < cur.close ? Math.min(bbLower, rrTP) : rrTP;
                    const gpTag = ' 🎯GP';
                    const retracePct = lastSH && lastSL
                        ? Math.round(((cur.close - lastSL.price) / Math.max(lastSH.price - lastSL.price, 0.0001)) * 100)
                        : 0;
                    return {
                        isLong: false, price: cur.close, rsi: lastBBP, tpPrice, slPrice,
                        candle: candleLabel(false) + gpTag + ' 🟥OB',
                        rsiBonus: true, retracePct
                    };
                }
            }

            return { isLong: null, price: cur.close, rsi: lastBBP, reason: `BB %B: ${lastBBP.toFixed(2)}` };
        }

        // ── Dados ────────────────────────────────────────────────────────────────
        async function fetchAllUsdtSymbols() {
            try {
                const params = new URLSearchParams({ category: 'linear', status: 'Trading', limit: '1000' });
                const res = await fetch(`${apiInstrumentsUrl}?${params}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (json.retCode !== 0) throw new Error(json.retMsg);
                const list = json.result.list.filter(s => s.symbol.endsWith('USDT'));
                list.forEach(s => {
                    const lev = Number(s.leverageFilter?.maxLeverage ?? MAX_LEVERAGE);
                    symbolLeverage[s.symbol] = lev > 0 ? lev : MAX_LEVERAGE;
                });
                return list.map(s => s.symbol).sort();
            } catch (err) {
                log(`❌ Erro ao buscar lista de ativos: ${err.message}`);
                return [];
            }
        }

        async function fetchKlineData(symbol, interval, limit = 200) {
            const params = new URLSearchParams({ category: 'linear', symbol, interval, limit: String(limit) });
            try {
                const res = await fetch(`${apiKlineUrl}?${params}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (json.retCode !== 0) throw new Error(json.retMsg);
                return json.result.list.map(item => ({
                    time: Number(item[0]),
                    open: Number(item[1]),
                    high: Number(item[2]),
                    low: Number(item[3]),
                    close: Number(item[4]),
                    volume: Number(item[5])
                })).reverse();
            } catch (_) {
                return [];
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ── Loop principal ───────────────────────────────────────────────────────
        async function checkSignal() {
            if (!isRunning) return;
            if (isScanning) {
                log('⏳ Varredura anterior ainda em andamento, aguardando...');
                return;
            }
            isScanning = true;
            try {
                if (allSymbols.length === 0) {
                    log('🔄 Buscando lista de ativos USDT...');
                    allSymbols = await fetchAllUsdtSymbols();
                    if (allSymbols.length === 0) { isScanning = false; return; }
                    log(`✅ ${allSymbols.length} ativos carregados.`);
                }

                let found = 0;
                for (let i = 0; i < allSymbols.length; i++) {
                    if (!isRunning) break;
                    const symbol = allSymbols[i];
                    updateStatus(`🔍 Escaneando ${i + 1}/${allSymbols.length} — ${symbol}`);

                    const candles = await fetchKlineData(symbol, INTERVAL, 250);
                    if (candles.length < 120) { await delay(SCAN_DELAY_MS); continue; }

                    const currentTs = candles[candles.length - 2].time; // timestamp do candle fechado                    // evita re-alertar no mesmo candle para o mesmo ativo
                    if (lastSignalTimestamps[symbol] === currentTs) { await delay(SCAN_DELAY_MS); continue; }

                    const result = analyzeSignal(candles);
                    if (!result) { await delay(SCAN_DELAY_MS); continue; }

                    if (result.isLong === true || result.isLong === false) {
                        const dir = result.isLong ? 'LONG 🟢' : 'SHORT 🔴';
                        const trendLbl = result.isLong ? 'Tendência Alta' : 'Tendência Baixa';
                        lastSignalTimestamps[symbol] = currentTs;
                        found++;

                        const bankInput = document.getElementById('bankValue').value;
                        const bank = (bankInput && Number(bankInput) > 0) ? Number(bankInput) : 100;

                        const bybitUrl = `https://www.bybit.com/trade/usdt/${symbol}`;
                        const symLink = `<a href="${bybitUrl}" target="_blank">${symbol}</a>`;
                        const symMaxLev = symbolLeverage[symbol] ?? MAX_LEVERAGE;

                        if (result.smcOB) {
                            const smcDir = result.isLong ? 'OB LONG 🏛️🟢' : 'OB SHORT 🏛️🔴';
                            log(`🏛️ ${symLink} — SMC ${smcDir} | ${trendLbl} | ${result.candle} | BB %B: ${result.rsi.toFixed(2)} | TP: ${result.tpPrice.toFixed(6)} | SL: ${result.slPrice.toFixed(6)}`);
                            showSignalCard(result.isLong, symbol, result.price, result.rsi, result.tpPrice, result.slPrice, result.candle, true, symMaxLev);
                            playAlert(result.isLong);
                            const tgSmcMsg = buildTelegramSmcMsg(result.isLong, symbol, result.price, result.rsi, result.tpPrice, result.slPrice, result.candle, result.retracePct, bank, symMaxLev);
                            sendTelegram(tgSmcMsg)
                                .then(() => log(`📬 Sinal SMC de ${symLink} enviado para o Telegram!`))
                                .catch(err => log(`⚠️ Telegram erro (${symbol}): ${err.message}`));
                        } else {
                            const setupLbl = result.isLong ? 'Reversão Bullish' : 'Reversão Bearish';
                            log(`🚀 ${symLink} — ${dir} | BB %B Extremo | ${trendLbl} | ${setupLbl} | ${result.candle} | TP: ${result.tpPrice.toFixed(6)} | SL: ${result.slPrice.toFixed(6)}`);
                            showSignalCard(result.isLong, symbol, result.price, result.rsi, result.tpPrice, result.slPrice, result.candle, false, symMaxLev);
                            playAlert(result.isLong);
                            const tgMsg = buildTelegramMsg(result.isLong, symbol, result.price, result.rsi, result.tpPrice, result.slPrice, result.candle, result.rsiBonus, result.retracePct, bank, symMaxLev);
                            sendTelegram(tgMsg)
                                .then(() => log(`📬 Sinal de ${symLink} enviado para o Telegram!`))
                                .catch(err => log(`⚠️ Telegram erro (${symbol}): ${err.message}`));
                        }
                    }

                    await delay(SCAN_DELAY_MS);
                }

                if (isRunning) {
                    const hora = new Date().toLocaleTimeString('pt-BR');
                    updateStatus(`🟢 Ativo — ${allSymbols.length} ativos | Última varredura: ${hora}`);
                    log(`✅ Varredura concluída — ${allSymbols.length} ativos | Sinais encontrados: ${found}`);
                }
            } catch (err) {
                log(`❌ Erro: ${err.message}`);
            } finally {
                isScanning = false;
            }
        }

        // ── Controles ────────────────────────────────────────────────────────────
        function setBtnState(running) {
            document.getElementById('start-btn').disabled = running;
            document.getElementById('stop-btn').disabled = !running;
        }

        function startBot() {
            isRunning = true;
            localStorage.setItem('botRunning', '1');
            setBtnState(true);
            updateStatus('🟢 Ativo — iniciando varredura...');
            log('▶️ Bot iniciado! Monitorando todos os ativos USDT (1H) — Reversão BB %B Extremo Strategy.');
            checkSignal();
            botInterval = setInterval(checkSignal, checkInterval);
            showSnackbar('Bot iniciado!');
        }

        function stopBot() {
            isRunning = false;
            localStorage.removeItem('botRunning');
            clearInterval(botInterval);
            botInterval = null;
            isScanning = false;
            lastSignalTimestamps = {};
            allSymbols = [];
            symbolLeverage = {};
            setBtnState(false);
            hideSignalCard();
            updateStatus('🔴 Parado');
            log('⏹️ Bot parado.');
            showSnackbar('Bot parado!');
        }

        function checkNow() {
            if (!isRunning) { showSnackbar('Inicie o bot primeiro.'); return; }
            log('🔄 Forçando verificação...');
            lastSignalTimestamps = {};
            checkSignal();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Restaura valor da banca salvo
            const savedBank = localStorage.getItem('bankValue');
            if (savedBank) document.getElementById('bankValue').value = savedBank;

            // Persiste valor da banca ao digitar
            document.getElementById('bankValue').addEventListener('input', () => {
                const v = document.getElementById('bankValue').value;
                if (v) localStorage.setItem('bankValue', v);
                else localStorage.removeItem('bankValue');
            });

            log('📊 Bot carregado — OB + BB %B + Vela + Swing + Golden Pocket');
            log('🔴 ALERTA FORTE: candle atual no OB + BB %B extremo revertendo + Vela Ouro/Prata + HH/HL ou LH/LL + Golden Pocket 0.705');
            log('🥇 OURO: range atual > range anterior | 🥈 PRATA: range atual > média dos últimos 3 candles');
            log('📐 TP = BB oposta / RR 2:1 | SL = fundo (long) ou topo (short) do candle de entrada');

            // Retoma bot automaticamente se estava ativo antes de sair da página
            if (localStorage.getItem('botRunning') === '1') {
                log('🔁 Estado anterior detectado — retomando bot automaticamente...');
                startBot();
            } else {
                setBtnState(false);
                updateStatus('✅ Pronto para iniciar!');
            }
        });
    </script>
